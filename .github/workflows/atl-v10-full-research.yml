name: ATL V1.0 Full Research

on:
  push:
    paths:
      - '.github/workflows/atl-v10-full-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pandas numpy tabulate
      - name: Build Atlanta quantitative research core
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap, requests
          H={'User-Agent':'Mozilla/5.0 ATL-V1.0/1.0'}
          j=requests.get('https://statsapi.mlb.com/api/v1/teams/144/stats',params={'stats':'gameLog','group':'hitting','season':2026,'gameType':'R'},headers=H,timeout=90).json()
          seen={}
          for s in j.get('stats',[{}])[0].get('splits',[]):
            dt=s.get('date');pk=(s.get('game') or {}).get('gamePk')
            if dt and pk and dt<='2026-07-22':seen[int(pk)]=s
          n26=len(seen); total=324+n26
          print('ATL 2026 cutoff games',n26,'total universe',total)
          src=Path('.github/workflows/bal-v42-full-recalc.yml').read_text(encoding='utf-8')
          code=src.split("python - <<'PY'\n",1)[1].rsplit("\n          PY",1)[0]
          code=textwrap.dedent(code)
          reps=[
            ("runtime/bal_v42_final","runtime/atl_v10_final"),
            ("TEAM_ID=110;TEAM='BAL'","TEAM_ID=144;TEAM='ATL'"),
            ("BAL-V4.2","ATL-V1.0"),
            ("BAL V4.2","ATL V1.0"),
            ("Baltimore","Atlanta Braves"),
            ("BAL starter","ATL starter"),
            ("'2024':('2024-03-28','2024-09-29',162,3.166)","'2024':('2024-03-28','2024-09-30',162,3.166)"),
            ("'2026_CUTOFF':('2026-03-25','2026-07-20',101,None)",f"'2026_CUTOFF':('2026-03-25','2026-07-22',{n26},None)"),
            ("if cov!={'2024':162,'2025':162,'2026_CUTOFF':101}",f"if cov!={{'2024':162,'2025':162,'2026_CUTOFF':{n26}}}"),
            ("2026-07-20","2026-07-22"),
            ("bal_425",f"atl_{total}"),
            ("bal_","atl_"),
            ("425",str(total))
          ]
          for a,b in reps: code=code.replace(a,b)
          ns={'__name__':'__main__'}
          exec(compile(code,'<atl-v10-generated>','exec'),ns,ns)
          PY
      - name: Build Atlanta synthesis and classifications
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, requests, pandas as pd
          OUT=Path('runtime/atl_v10_final')
          qa=json.loads((OUT/'qa_final_team_research.json').read_text())
          total=sum(qa['games'].values())
          gfile=next(OUT.glob('atl_*_game_reconstruction.csv'))
          g=pd.read_csv(gfile);g['DATE']=pd.to_datetime(g.DATE);g['W']=(g.RS>g.RA).astype(int);g['L']=(g.RS<g.RA).astype(int);g['ONE_RUN']=(g.RS-g.RA).abs().eq(1)
          summary=[]
          for p in ['2024','2025','2026_CUTOFF']:
            d=g[g.PERIOD==p].copy().sort_values(['DATE','GAME_PK']);home=d[d.IS_HOME.astype(bool)];away=d[~d.IS_HOME.astype(bool)];one=d[d.ONE_RUN]
            summary.append({'PERIOD':p,'G':len(d),'W':int(d.W.sum()),'L':int(d.L.sum()),'RS':int(d.RS.sum()),'RA':int(d.RA.sum()),'R_G':round(d.RS.mean(),3),'RA_G':round(d.RA.mean(),3),'DIFF':int(d.RS.sum()-d.RA.sum()),'HOME_W':int(home.W.sum()),'HOME_L':int(home.L.sum()),'AWAY_W':int(away.W.sum()),'AWAY_L':int(away.L.sum()),'ONE_RUN_W':int(one.W.sum()),'ONE_RUN_L':int(one.L.sum())})
          pd.DataFrame(summary).to_csv(OUT/'phase2_results_summary.csv',index=False)
          d=g[g.PERIOD=='2026_CUTOFF'].sort_values(['DATE','GAME_PK']);recent=[]
          for n in [3,5,7,10]:
            x=d.tail(n);recent.append({'WINDOW':n,'W':int(x.W.sum()),'L':int(x.L.sum()),'RS':int(x.RS.sum()),'RA':int(x.RA.sum()),'DIFF':int(x.RS.sum()-x.RA.sum()),'FROM':str(x.DATE.min().date()),'TO':str(x.DATE.max().date())})
          pd.DataFrame(recent).to_csv(OUT/'phase2_recent_form.csv',index=False)
          H={'User-Agent':'Mozilla/5.0 ATL-V1.0-rank/1.0'}
          teams=requests.get('https://statsapi.mlb.com/api/v1/teams',params={'sportId':1},headers=H,timeout=90).json()['teams'];ranks=[]
          for t in teams:
            tid=int(t['id'])
            def gl(group):
              j=requests.get(f'https://statsapi.mlb.com/api/v1/teams/{tid}/stats',params={'stats':'gameLog','group':group,'season':2026,'gameType':'R'},headers=H,timeout=90).json();seen={}
              for s in j.get('stats',[{}])[0].get('splits',[]):
                if s.get('date') and s['date']<='2026-07-22' and (s.get('game') or {}).get('gamePk'):seen[int(s['game']['gamePk'])]=s
              return list(seen.values())
            hit=gl('hitting');pit=gl('pitching')
            if not hit or not pit:continue
            rs=sum(int((s.get('stat') or {}).get('runs',0) or 0) for s in hit);ra=sum(int((s.get('stat') or {}).get('runs',0) or 0) for s in pit)
            ranks.append({'TEAM_ID':tid,'TEAM':t['name'],'G':len(hit),'RS':rs,'R_G':rs/len(hit),'RA':ra,'RA_G':ra/len(pit)})
          r=pd.DataFrame(ranks);r['OFF_RANK']=r.R_G.rank(method='min',ascending=False).astype(int);r['PITCH_RANK']=r.RA_G.rank(method='min',ascending=True).astype(int);r.to_csv(OUT/'league_ranks_2026_cutoff.csv',index=False)
          a=r[r.TEAM_ID==144].iloc[0]
          def cls(rank):return 'Fuerte' if rank<=10 else ('Media' if rank<=20 else 'Débil')
          defense=pd.read_csv(OUT/'phase11_savant_defense_team.csv');frv=float(defense.loc[defense.PERIOD=='2026_CUTOFF','FRV_TOTAL'].iloc[0]);dcls='Fuerte' if frv>=10 else ('Débil' if frv<=-10 else 'Media')
          result={'cutoff':'2026-07-22','games_total':total,'offense_rank':int(a.OFF_RANK),'offense_class':cls(int(a.OFF_RANK)),'pitching_rank':int(a.PITCH_RANK),'pitching_class':cls(int(a.PITCH_RANK)),'defense_frv':round(frv,3),'defense_class':dcls,'team_research_status':'PASS'}
          (OUT/'atl_v10_synthesis.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2));print(pd.DataFrame(summary).to_string(index=False));print(pd.DataFrame(recent).to_string(index=False))
          PY
      - name: Commit outputs
        if: always()
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email 'mlb-research-bot@users.noreply.github.com'
          git add runtime/atl_v10_final || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'ATL V1.0: build reproducible team research'; git push; fi
