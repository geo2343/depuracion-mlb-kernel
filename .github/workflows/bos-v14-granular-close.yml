          (OUT/'BOS_V14_GRANULAR.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps(qa,indent=2));print(shape.to_string(index=False));print(b18.to_string(index=False));print(b19.to_string(index=False))
