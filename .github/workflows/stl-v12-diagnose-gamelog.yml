name: STL V1.2 Diagnose MLB GameLog

on:
  push:
    paths:
      - '.github/workflows/stl-v12-diagnose-gamelog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Fetch gameLog
        run: |
          python - <<'PY'
          import requests, json
          from pathlib import Path
          out={}
          for y in [2024,2025,2026]:
            u='https://statsapi.mlb.com/api/v1/teams/138/stats'
            p={'stats':'gameLog','group':'hitting','season':y,'gameType':'R'}
            j=requests.get(u,params=p,timeout=90).json()
            splits=j.get('stats',[{}])[0].get('splits',[])
            rows=[]
            for s in splits:
              rows.append({'date':s.get('date'),'gamePk':(s.get('game') or {}).get('gamePk'),'opponent':(s.get('opponent') or {}).get('name'),'stat':s.get('stat',{})})
            out[str(y)]={'count':len(rows),'first':rows[:2],'last':rows[-5:]}
          Path('runtime/stl_v12').mkdir(parents=True,exist_ok=True)
          Path('runtime/stl_v12/gamelog_diagnostic.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email 'mlb-research-bot@users.noreply.github.com'
          git add runtime/stl_v12/gamelog_diagnostic.json
          git commit -m 'STL V1.2: add gameLog diagnostic' || true
          git push || true
