name: BHSSM ATL-MIL 2026-08-23

on:
  push:
    paths:
      - 'scripts/bhssm_atl_mil_20260823.py'
      - '.github/workflows/bhssm-atl-mil-20260823.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-bhssm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 573adf2c9ea7417589ac37cbd47b839f7700db49
      SOURCE_COMMIT_TIME: '2026-08-23T22:52:27Z'
      SOURCE_DIR: source-data
      RUN_REQUEST_ID: '2026-08-23T20-20-EDT'
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install statistical dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scipy scikit-learn ruptures

      - name: Fetch sovereign pregame source snapshot
        run: |
          rm -rf source-data
          git init source-data
          git -C source-data remote add origin https://github.com/lancebroz/mlb-pitcher-data.git
          git -C source-data fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C source-data checkout --detach FETCH_HEAD
          printf 'SOURCE_HEAD=%s\n' "$(git -C source-data rev-parse HEAD)"

      - name: Execute BHSSM
        run: python scripts/bhssm_atl_mil_20260823.py

      - name: Commit auditable outputs
        run: |
          git config user.name 'BHSSM Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add bhssm_outputs/ATL_MIL_2026-08-23
          if git diff --cached --quiet; then
            echo 'No output changes to commit.'
          else
            git commit -m 'BHSSM: execute ATL-MIL pregame cutoff 2026-08-22'
            git push
          fi

      - name: Upload execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhssm-atl-mil-20260823
          path: bhssm_outputs/ATL_MIL_2026-08-23
          if-no-files-found: error
