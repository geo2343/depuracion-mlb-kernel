name: HBM26 Combine V30-V36 Sheet01

on:
  push:
    paths:
      - '.github/workflows/hbm26-combine-v30-v36-sheet01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combine certified rows
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          files = [
              'runtime/hbm26_v30_sheet01_0508.csv',
              'runtime/hbm26_v31_sheet01_0509.csv',
              'runtime/hbm26_v32_sheet01_0510.csv',
              'runtime/hbm26_v33_sheet01_0511.csv',
              'runtime/hbm26_v34_sheet01_0512.csv',
              'runtime/hbm26_v35_sheet01_0513.csv',
              'runtime/hbm26_v36_sheet01_0514.csv',
          ]
          expected = [91,86,99,39,95,103,66]
          out = Path('runtime/hbm26_v30_v36_sheet01_0508_0514_noheader.csv')
          total = 0
          with out.open('w', encoding='utf-8', newline='') as fo:
              w = csv.writer(fo)
              for p, exp in zip(files, expected):
                  with open(p, encoding='utf-8', newline='') as fi:
                      r = csv.reader(fi)
                      header = next(r)
                      if len(header) != 40:
                          raise SystemExit(f'Bad header width {p}: {len(header)}')
                      rows = list(r)
                      if len(rows) != exp:
                          raise SystemExit(f'Bad row count {p}: {len(rows)} != {exp}')
                      for row in rows:
                          if len(row) != 40:
                              raise SystemExit(f'Bad row width {p}: {len(row)}')
                          w.writerow(row)
                      total += len(rows)
          if total != 579:
              raise SystemExit(f'Combined row count {total} != 579')
          print('COMBINED_ROWS=579')
          PY
      - name: Commit combined CSV
        run: |
          git config user.name 'hbm26-qa-bot'
          git config user.email 'hbm26-qa-bot@users.noreply.github.com'
          git add runtime/hbm26_v30_v36_sheet01_0508_0514_noheader.csv
          git commit -m 'HBM-26: combine certified 2026-05-08 through 2026-05-14 rows'
          git push
