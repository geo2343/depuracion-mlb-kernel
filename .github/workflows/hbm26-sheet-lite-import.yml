name: HBM26 Sheet Lite Import

on:
  push:
    paths:
      - '.github/workflows/hbm26-sheet-lite-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas
      - name: Compact deterministic columns
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('runtime/hbm26_sheet01_import.csv')
          df=pd.read_csv(p,keep_default_na=False)
          # These columns are deterministic and will be regenerated in Google Sheets.
          for c in ['RELIEVER_APPEARANCE_ID','ROLE','SOURCE_URL','QA_STATUS']:
              df[c]=''
          df.to_csv('runtime/hbm26_sheet01_lite.csv',index=False)
          print({'rows':len(df),'cols':len(df.columns)})
          PY
      - name: Commit lite import
        run: |
          git config user.name 'hbm26-qa-bot'
          git config user.email 'hbm26-qa-bot@users.noreply.github.com'
          git add runtime/hbm26_sheet01_lite.csv
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'HBM-26: compact Sheet transfer file'; git push; fi
