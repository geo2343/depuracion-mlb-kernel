name: HBM26 Export V79-V85

on:
  push:
    paths:
      - '.github/workflows/hbm26-export-v79-v85.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify certified CSVs
        run: |
          set -euo pipefail
          for f in \
            runtime/hbm26_v79_sheet01_0626.csv \
            runtime/hbm26_v80_sheet01_0627.csv \
            runtime/hbm26_v81_sheet01_0628.csv \
            runtime/hbm26_v82_sheet01_0629.csv \
            runtime/hbm26_v83_sheet01_0630.csv \
            runtime/hbm26_v84_sheet01_0701.csv \
            runtime/hbm26_v85_sheet01_0702.csv; do
            test -s "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hbm26-v79-v85-certified-csv
          path: |
            runtime/hbm26_v79_sheet01_0626.csv
            runtime/hbm26_v80_sheet01_0627.csv
            runtime/hbm26_v81_sheet01_0628.csv
            runtime/hbm26_v82_sheet01_0629.csv
            runtime/hbm26_v83_sheet01_0630.csv
            runtime/hbm26_v84_sheet01_0701.csv
            runtime/hbm26_v85_sheet01_0702.csv
          if-no-files-found: error
          retention-days: 7
