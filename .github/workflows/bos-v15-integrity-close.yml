          for s in gl.get('stats',[{}])[0].get('splits',[]):
            dt=s.get('date');pk=(s.get('game') or {}).get('gamePk')
            if dt and pk and dt<=CUTOFF:games.append((dt,int(pk)))
          tmp={pk:dt for dt,pk in games};games=sorted([(dt,pk) for pk,dt in tmp.items()]);assert len(games)==101;u10_games=games[-10:];u10pks={pk for dt,pk in u10_games}

