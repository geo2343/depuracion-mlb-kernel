            opp_hand='UNKNOWN'
            if opp_start:
              key='ID'+str(opp_start['person']['id']);opp_hand=((f['gameData'].get('players') or {}).get(key) or {}).get('pitchHand',{}).get('code','UNKNOWN')
            players=f['liveData']['boxscore']['teams'][ts]['players'];starters={}
            subs=set()
            for pp in players.values():
