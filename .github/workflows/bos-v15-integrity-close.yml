name: BOS V15 Integrity Close

on:
  push:
    paths:
      - '.github/workflows/bos-v15-integrity-close.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pandas numpy tabulate
      - name: Reconstruct reopened contractual blocks
        run: |
          python - <<'PY'
          import io,json,time,math,re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests,pandas as pd,numpy as np

          OUT=Path('runtime/bos_v15_integrity');OUT.mkdir(parents=True,exist_ok=True)
          TEAM_ID=111; TOR_ID=141; GAME_PK=824733; CUTOFF='2026-07-23'; GAME_DATE='2026-07-24'
          H={'User-Agent':'Mozilla/5.0 BOS-V15/1.0'}
          ACTIVE_NAMES=['Anthony Seigler','Ceddanne Rafaela','Wilyer Abreu','Willson Contreras','Masataka Yoshida','Caleb Durbin','Jarren Duran','Andruw Monasterio','Connor Wong','Carlos Narváez','Tsung-Che Cheng','Romy Gonzalez','Jahmai Jones']
          HIT={'single','double','triple','home_run'}; XBH={'double','triple','home_run'}; BB={'walk','intent_walk'}; K={'strikeout','strikeout_double_play'}
          SW={'swinging_strike','swinging_strike_blocked','foul','foul_tip','hit_into_play','hit_into_play_no_out','hit_into_play_score'}; WH={'swinging_strike','swinging_strike_blocked'}
          FAM={'FF':'FASTBALL','SI':'FASTBALL','FC':'FASTBALL','FA':'FASTBALL','SL':'BREAKING','ST':'BREAKING','SV':'BREAKING','CU':'BREAKING','KC':'BREAKING','CS':'BREAKING','CH':'OFFSPEED','FS':'OFFSPEED','FO':'OFFSPEED','SC':'OFFSPEED'}

          def getj(url,params=None,tries=7):
            last=None
            for i in range(tries):
              try:
                r=requests.get(url,params=params,headers=H,timeout=90);r.raise_for_status();return r.json()
              except Exception as e:last=e;time.sleep(1.0*(i+1))
            raise last
          def sav(pk,tries=6):
            last=None;url=f'https://baseballsavant.mlb.com/statcast_search/csv?all=true&type=details&game_pk={int(pk)}'
            for i in range(tries):
              try:
                r=requests.get(url,headers=H,timeout=90);r.raise_for_status();d=pd.read_csv(io.StringIO(r.text))
                if d.empty:raise RuntimeError('empty savant')
                return int(pk),d
              except Exception as e:last=e;time.sleep(1.2*(i+1))
            raise last
          def ip_outs(v):
            try:
              a,b=str(v).split('.');return int(a)*3+int(b)
            except:return 0
          def outs_ip(o):return f'{o//3}.{o%3}'
          def sdiv(a,b):return float(a)/float(b) if b else np.nan
          def norm(s):return re.sub(r'[^a-z]','',str(s).lower())
          def woba_x(d):
            q=d[d.events.notna()].copy();wv=pd.to_numeric(q.woba_value,errors='coerce');wd=pd.to_numeric(q.woba_denom,errors='coerce');est=pd.to_numeric(q.estimated_woba_using_speedangle,errors='coerce');xc=wv.copy();xc.loc[est.notna()]=est.loc[est.notna()];den=wd.fillna(0).sum();return sdiv(wv.fillna(0).sum(),den),sdiv(xc.fillna(0).sum(),den)
          def metrics(d):
            if d.empty:return {'PITCHES':0,'PA':0,'AB':0,'BBE':0,'H':0,'XBH':0,'HR':0,'BB':0,'K':0,'OBP_PROXY':np.nan,'SLG_PROXY':np.nan,'BB_PCT':np.nan,'K_PCT':np.nan,'WHIFF_PCT':np.nan,'HARD_HIT_PCT':np.nan,'WOBA':np.nan,'XWOBA':np.nan}
            desc=d.description.astype(str);sw=desc.isin(SW);wh=desc.isin(WH);pa=d[d.events.notna()].copy();ev=pa.events.astype(str);ab=ev.isin(HIT|{'field_out','force_out','grounded_into_double_play','field_error','fielders_choice','fielders_choice_out','strikeout','strikeout_double_play','double_play','triple_play'}).sum();h=ev.isin(HIT).sum();xbb=ev.isin(XBH).sum();hr=ev.eq('home_run').sum();bb=ev.isin(BB).sum();kk=ev.isin(K).sum();hbp=ev.eq('hit_by_pitch').sum();bbe=d[pd.to_numeric(d.launch_speed,errors='coerce').notna()];w,x=woba_x(d);tb=(ev.eq('single').sum()+2*ev.eq('double').sum()+3*ev.eq('triple').sum()+4*hr)
            return {'PITCHES':len(d),'PA':len(pa),'AB':int(ab),'BBE':len(bbe),'H':int(h),'XBH':int(xbb),'HR':int(hr),'BB':int(bb),'K':int(kk),'OBP_PROXY':sdiv(h+bb+hbp,ab+bb+hbp),'SLG_PROXY':sdiv(tb,ab),'BB_PCT':100*sdiv(bb,len(pa)),'K_PCT':100*sdiv(kk,len(pa)),'WHIFF_PCT':100*sdiv(wh.sum(),sw.sum()),'HARD_HIT_PCT':100*sdiv((pd.to_numeric(bbe.launch_speed,errors='coerce')>=95).sum(),len(bbe)),'WOBA':w,'XWOBA':x}

          # Official pregame lineup from feed; use lineup only, never result.
          feed=getj(f'https://statsapi.mlb.com/api/v1.1/game/{GAME_PK}/feed/live');gd=feed['gameData'];ld=feed['liveData'];side='home' if int(gd['teams']['home']['id'])==TEAM_ID else 'away';opside='away' if side=='home' else 'home'
          lrows=[]
          for pp in ld['boxscore']['teams'][side]['players'].values():
            bo=str(pp.get('battingOrder') or '')
            if len(bo)==3 and bo.endswith('00'):lrows.append({'ORDER':int(bo[0]),'BATTER_ID':int(pp['person']['id']),'BATTER':pp['person']['fullName'],'POSITION':(pp.get('position') or {}).get('abbreviation','')})
          lineup=pd.DataFrame(lrows).sort_values('ORDER').drop_duplicates('ORDER');assert len(lineup)==9
          lineup.to_csv(OUT/'official_lineup.csv',index=False)

          # As-of-date roster IDs for the 13 known active offensive profiles.
          roster=getj(f'https://statsapi.mlb.com/api/v1/teams/{TEAM_ID}/roster',{'rosterType':'active','date':GAME_DATE}).get('roster',[])
          rmap={norm(x['person']['fullName']):x for x in roster};active=[]
          for nm in ACTIVE_NAMES:
            x=rmap.get(norm(nm))
            if not x:
              p=getj('https://statsapi.mlb.com/api/v1/people/search',{'names':nm}).get('people',[]);assert p,nm;pid=int(p[0]['id']);pos='UNKNOWN'
            else:pid=int(x['person']['id']);pos=(x.get('position') or {}).get('abbreviation','')
            active.append({'BATTER':nm,'BATTER_ID':pid,'ROSTER_POSITION':pos,'ACTIVE_ROSTER':bool(x)})
          active=pd.DataFrame(active);active.to_csv(OUT/'active13.csv',index=False);active_ids=set(active.BATTER_ID.astype(int));idname=dict(zip(active.BATTER_ID.astype(int),active.BATTER))

          # Boston completed game universe through cutoff.
