          season={};u10m={}
          for bid in lineup.BATTER_ID.astype(int):season[bid]=metrics(bat[bat.batter==bid]);u10m[bid]=metrics(bat[(bat.batter==bid)&(bat.game_pk.isin(u10pks))])
