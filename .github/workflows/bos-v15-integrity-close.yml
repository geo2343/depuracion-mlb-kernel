            fs=[ex.submit(sav,pk) for dt,pk in games]
            for f in as_completed(fs):pk,d=f.result();frames.append(d)
          z=pd.concat(frames,ignore_index=True);z['game_pk']=pd.to_numeric(z.game_pk,errors='coerce').astype('Int64');bot=z.inning_topbot.astype(str).str.lower().isin(['bot','bottom']);top=z.inning_topbot.astype(str).str.lower().eq('top');home=z.home_team.astype(str).eq('BOS');bat=z[(home&bot)|((~home)&top)].copy();bat=bat[pd.to_numeric(bat.batter,errors='coerce').isin(active_ids)].copy();bat['game_date']=pd.to_datetime(bat.game_date);bat['batter']=pd.to_numeric(bat.batter,errors='coerce').astype('Int64');bat['pitcher']=pd.to_numeric(bat.pitcher,errors='coerce').astype('Int64');bat['FAMILY']=bat.pitch_type.astype(str).map(FAM).fillna('OTHER')

          # B7 complete windows for all 13 profiles.
