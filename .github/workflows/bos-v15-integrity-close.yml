            d=bat[bat.batter==bid].sort_values(['game_date','game_pk','at_bat_number','pitch_number']);pa=d[d.events.notna()].copy();pa_keys=pa[['game_pk','at_bat_number']].drop_duplicates().values.tolist()
            def last_n_pa(n):
              keys=pa[['game_pk','at_bat_number']].drop_duplicates().tail(n);return d.merge(keys,on=['game_pk','at_bat_number'],how='inner')
            windows=[('10_PA',last_n_pa(10)),('20_PA',last_n_pa(20)),('30_PA',last_n_pa(30))]
            for days in [7,14,30]:windows.append((f'{days}_DAYS',d[d.game_date>=pd.Timestamp(CUTOFF)-pd.Timedelta(days=days-1)]))
            windows.append(('SEASON',d));windows.append(('VS_RHP',d[d.p_throws.astype(str)=='R']));windows.append(('VS_LHP',d[d.p_throws.astype(str)=='L']))
            for label,x in windows:
              m=metrics(x);start=str(x.game_date.min().date()) if len(x) else 'NO_SAMPLE';end=str(x.game_date.max().date()) if len(x) else 'NO_SAMPLE';req=10 if label=='10_PA' else (20 if label=='20_PA' else (30 if label=='30_PA' else 1));suff='SUFFICIENT' if (m['PA']>=req if '_PA' in label else m['PA']>=20) else 'LIMITED'
              b7.append({'BATTER_ID':bid,'BATTER':idname[bid],'WINDOW':label,'START_DATE':start,'END_DATE':end,'PITCHES':m['PITCHES'],'PA':m['PA'],'AB':m['AB'],'BBE':m['BBE'],'H':m['H'],'XBH':m['XBH'],'HR':m['HR'],'BB':m['BB'],'K':m['K'],'OBP_PROXY':m['OBP_PROXY'],'SLG_PROXY':m['SLG_PROXY'],'WOBA':m['WOBA'],'XWOBA':m['XWOBA'],'SAMPLE_STATUS':suff,'NOTE':'Units preserved; limited samples are labeled, never padded.'})
            for fam in ['FASTBALL','BREAKING','OFFSPEED']:
              x=d[d.FAMILY==fam];m=metrics(x);b7.append({'BATTER_ID':bid,'BATTER':idname[bid],'WINDOW':'FAMILY_'+fam,'START_DATE':str(x.game_date.min().date()) if len(x) else 'NO_SAMPLE','END_DATE':str(x.game_date.max().date()) if len(x) else 'NO_SAMPLE','PITCHES':m['PITCHES'],'PA':m['PA'],'AB':m['AB'],'BBE':m['BBE'],'H':m['H'],'XBH':m['XBH'],'HR':m['HR'],'BB':m['BB'],'K':m['K'],'OBP_PROXY':m['OBP_PROXY'],'SLG_PROXY':m['SLG_PROXY'],'WOBA':m['WOBA'],'XWOBA':m['XWOBA'],'SAMPLE_STATUS':'SUFFICIENT' if m['PITCHES']>=50 else 'LIMITED','NOTE':'Pitch-family window; pitch count is primary sample.'})
          b7=pd.DataFrame(b7);assert b7.groupby('BATTER_ID').WINDOW.nunique().min()==11;b7.to_csv(OUT/'B07_windows_all13.csv',index=False)

          # B20 + B6 from official dated roster, transactions and official lineup/bench role.
          trans=getj('https://statsapi.mlb.com/api/v1/transactions',{'teamId':TEAM_ID,'startDate':'2026-07-01','endDate':GAME_DATE}).get('transactions',[])
          tby={bid:[] for bid in active_ids}
          for t in trans:
            pid=((t.get('person') or {}).get('id'))
            if pid in tby:tby[pid].append({'date':t.get('date'),'type':t.get('typeDesc'),'description':t.get('description')})
          lineup_ids=set(lineup.BATTER_ID.astype(int));functions={'Carlos Narváez':'C2/bench catcher','Tsung-Che Cheng':'IF bench/defense/pinch-run','Romy Gonzalez':'IF/OF bench/PH vs LHP/defense','Jahmai Jones':'OF/IF bench/PH/pinch-run'}
          b20=[];b6=[]
          for row in active.itertuples(index=False):
            bid=int(row.BATTER_ID);nm=row.BATTER;role=('STARTER '+str(int(lineup.loc[lineup.BATTER_ID==bid,'ORDER'].iloc[0])) if bid in lineup_ids else functions.get(nm,'BENCH'))
            tx=tby.get(bid,[]);txtext=' | '.join([f"{x['date']} {x['type']}: {x['description']}" for x in tx]) if tx else 'No material team transaction found 2026-07-01..07-24'
            health='Active roster as of 2026-07-24' if row.ACTIVE_ROSTER else 'Not found on dated active-roster response; requires manual review'
            mat='MATERIAL' if tx else 'NO_MATERIAL_TRANSACTION_IDENTIFIED'
            b20.append({'BATTER_ID':bid,'BATTER':nm,'FACT':txtext,'OWNER':'Roster/Availability + manager lineup','SOURCE':'MLB dated roster + MLB transactions + official lineup feed','PUBLICATION_OR_EVENT_TIME':'As recorded by MLB transaction/date feed','CONSULT_TIME':'V15 reconstruction','TIMEZONE':'America/New_York','EPISTEMIC':'CONFIRMED' if row.ACTIVE_ROSTER else 'REVIEW','VIGENCY':'PREGAME_SNAPSHOT','MATERIALITY':mat,'AVAILABILITY':health,'ROLE_DECISION':role,'MANAGER_DECLARATION':'No separate public declaration required/identified; lineup decision itself is official.','CONTRADICTION':'NONE','IMPACT':'Role/availability only; no pick.'})
            b6.append({'BATTER_ID':bid,'BATTER':nm,'HAND':('L' if nm in ['Anthony Seigler','Wilyer Abreu','Masataka Yoshida','Jarren Duran','Tsung-Che Cheng'] else 'R'),'PRIMARY_POSITION':row.ROSTER_POSITION,'ROLE_CURRENT':role,'HEALTH_REFERENCE':health,'SUBSTITUTION_RISK':'LOW' if bid in lineup_ids and int(lineup.loc[lineup.BATTER_ID==bid,'ORDER'].iloc[0])<=4 else 'MEDIUM','SUBSTITUTE_OR_FUNCTION':functions.get(nm,'See official bench/position overlap'),'OFFENSIVE_FUNCTION':'Starter order/bench function documented; detailed process in B7/B10/B21.','SOURCE':'MLB dated roster + official lineup + B7/B10/B21','PRESS_SIGNAL':txtext,'PRESS_MATERIALITY':mat,'CUTOFF':'2026-07-24 pregame','VIGENCY':'PREGAME_SNAPSHOT'})
          b20=pd.DataFrame(b20);b6=pd.DataFrame(b6);assert len(b20)==13 and len(b6)==13;b20.to_csv(OUT/'B20_health_roles_changes.csv',index=False);b6.to_csv(OUT/'B06_basic_cards.csv',index=False)

          # B17 exact recent opposition + current Toronto bullpen recent workload/performance.
          b17=[];u10_rel_outs=u10_rel_er=u10_rel_k=u10_rel_bb=0
          for dt,pk in u10_games:
            f=feeds[pk];home=int(f['gameData']['teams']['home']['id'])==TEAM_ID;os='away' if home else 'home';opp=f['gameData']['teams'][os];opl=f['liveData']['boxscore']['teams'][os]['players'];starter=None;rel=[]
            for pp in opl.values():
              st=(pp.get('stats') or {}).get('pitching') or {}
              if not st:continue
              if int(st.get('gamesStarted',0) or 0)==1:starter=(pp,st)
              else:rel.append((pp,st))
            shand='UNKNOWN';spmix='NO_STATCAST';svelo=np.nan;sid=None
            if starter:
              pp,st=starter;sid=int(pp['person']['id']);key='ID'+str(sid);shand=((f['gameData'].get('players') or {}).get(key) or {}).get('pitchHand',{}).get('code','UNKNOWN');zg=z[(z.game_pk==pk)&(pd.to_numeric(z.pitcher,errors='coerce')==sid)];cnt=zg.pitch_type.astype(str).value_counts();spmix='/'.join([f'{p}:{100*c/len(zg):.0f}%' for p,c in cnt.head(3).items()]) if len(zg) else 'NO_STATCAST';svelo=pd.to_numeric(zg.release_speed,errors='coerce').mean() if len(zg) else np.nan
            ro=re=rk=rb=0
            for pp,st in rel:
              ro+=ip_outs(st.get('inningsPitched','0.0'));re+=int(st.get('earnedRuns',0) or 0);rk+=int(st.get('strikeOuts',0) or 0);rb+=int(st.get('baseOnBalls',0) or 0)
            u10_rel_outs+=ro;u10_rel_er+=re;u10_rel_k+=rk;u10_rel_bb+=rb
            b17.append({'DATE':dt,'GAME_PK':pk,'OPPONENT':opp['name'],'STARTER':starter[0]['person']['fullName'] if starter else 'UNKNOWN','STARTER_HAND':shand,'STARTER_PITCH_MIX':spmix,'STARTER_AVG_VELO':svelo,'BULLPEN_IP':outs_ip(ro),'BULLPEN_ER':re,'BULLPEN_K':rk,'BULLPEN_BB':rb,'BULLPEN_ER9':9*re/(ro/3) if ro else np.nan,'PARK':f['gameData']['venue']['name'],'COMPARABILITY_NOTE':'Observed opposition game; descriptive comparator only.'})
          b17=pd.DataFrame(b17);b17.to_csv(OUT/'B17_recent_opposition.csv',index=False)
          # Toronto bullpen: games Jul17-Jul23, through pregame cutoff.
          tgl=getj(f'https://statsapi.mlb.com/api/v1/teams/{TOR_ID}/stats',{'stats':'gameLog','group':'hitting','season':2026,'gameType':'R'});tgames=[]
          for s in tgl.get('stats',[{}])[0].get('splits',[]):
            dt=s.get('date');pk=(s.get('game') or {}).get('gamePk')
            if dt and pk and '2026-07-17'<=dt<=CUTOFF:tgames.append((dt,int(pk)))
          tgames=sorted(set(tgames));to=te=tk=tb=tp=0;used23=[]
          for dt,pk in tgames:
            f=getj(f'https://statsapi.mlb.com/api/v1.1/game/{pk}/feed/live');hs='home' if int(f['gameData']['teams']['home']['id'])==TOR_ID else 'away'
            for pp in f['liveData']['boxscore']['teams'][hs]['players'].values():
              st=(pp.get('stats') or {}).get('pitching') or {}
              if not st or int(st.get('gamesStarted',0) or 0)==1:continue
              o=ip_outs(st.get('inningsPitched','0.0'));to+=o;te+=int(st.get('earnedRuns',0) or 0);tk+=int(st.get('strikeOuts',0) or 0);tb+=int(st.get('baseOnBalls',0) or 0);pc=int(st.get('numberOfPitches',0) or 0);tp+=pc
              if dt==CUTOFF:used23.append({'pitcher':pp['person']['fullName'],'pitches':pc,'outs':o})
          tor_er9=9*te/(to/3) if to else np.nan;u10_er9=9*u10_rel_er/(u10_rel_outs/3) if u10_rel_outs else np.nan;tor={'window':'2026-07-17..2026-07-23','games':len(tgames),'bullpen_ip':outs_ip(to),'ER':te,'K':tk,'BB':tb,'ER9':tor_er9,'pitches':tp,'used_on_2026-07-23':used23,'u10_opponent_bullpen_ER9':u10_er9,'comparability_delta_ER9':tor_er9-u10_er9 if pd.notna(tor_er9) and pd.notna(u10_er9) else None,'note':'Availability inferred only from recent workload; no guarantee of manager usage.'};(OUT/'B17_toronto_bullpen.json').write_text(json.dumps(tor,indent=2),encoding='utf-8')

