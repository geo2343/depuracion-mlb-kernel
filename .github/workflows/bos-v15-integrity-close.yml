              else:
                order=np.nan;pos='BENCH_OR_ABSENT';status='SUB_USED' if bid in subs else 'NOT_START';reason='No public rest reason identified in official feed; no cause imputed.'
              b3.append({'GAME_DATE':dt,'GAME_PK':pk,'BATTER_ID':bid,'BATTER':idname[bid],'STATUS':status,'ORDER':order,'POSITION':pos,'OPP_STARTER_HAND':opp_hand,'REST_REASON':reason,'SOURCE':'MLB feed/live','CUTOFF':CUTOFF})
          b3=pd.DataFrame(b3).sort_values(['GAME_DATE','BATTER']);assert len(b3)==130;b3.to_csv(OUT/'B03_u10_lineups_long.csv',index=False)
          b3sum=[]
          current_order=dict(zip(lineup.BATTER_ID.astype(int),lineup.ORDER.astype(int)))
