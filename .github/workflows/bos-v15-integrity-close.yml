            mode_order=int(pd.Series(orders).mode().iloc[0]) if orders else np.nan;cur=current_order.get(bid,np.nan);chg=(cur-mode_order) if pd.notna(cur) and pd.notna(mode_order) else np.nan
            b3sum.append({'BATTER_ID':bid,'BATTER':idname[bid],'STARTS_U10':len(st),'BENCH_OR_NOT_START':10-len(st),'SUB_USED':int((d.STATUS=='SUB_USED').sum()),'ORDERS_USED':','.join(map(str,sorted(set(orders)))) if orders else 'NONE','POSITIONS_USED':','.join(sorted(set(positions))) if positions else 'NONE','STARTS_VS_RHP':sum(h=='R' for h in hands),'STARTS_VS_LHP':sum(h=='L' for h in hands),'CONSECUTIVE_STARTS_AT_CUTOFF':consec,'MODE_ORDER_U10':mode_order,'OFFICIAL_ORDER':cur,'ORDER_CHANGE_VS_MODE':chg,'REST_REASON_POLICY':'Official feed only; unspecified managerial rests remain explicitly unknown.'})
          b3sum=pd.DataFrame(b3sum);b3sum.to_csv(OUT/'B03_u10_usage_summary.csv',index=False)

          # Fetch Savant for all 101 Boston games, then select current active 13 batting rows.
