            outs=int(x.OUTS.sum());ip=outs/3;Hn=int(x.H.sum());ER=int(x.ER.sum());HRn=int(x.HR.sum());BBn=int(x.BB.sum());HBP=int(x.HBP.sum());SO=int(x.SO.sum());BF=int(x.BF.sum());cf=constants[p]
            ua.append({'PERIOD':p,'ROLE':role,'IP':round(ip,3),'H':Hn,'ER':ER,'HR':HRn,'BB':BBn,'HBP':HBP,'SO':SO,'BF':BF,'ERA':round(ER*9/ip,3),'WHIP':round((Hn+BBn)/ip,3),'K9':round(SO*9/ip,3),'BB9':round(BBn*9/ip,3),'HR9':round(HRn*9/ip,3),'K_PCT':round(100*SO/BF,2),'BB_PCT':round(100*BBn/BF,2),'K_BB_PCT':round(100*(SO-BBn)/BF,2),'FIP':round((13*HRn+3*(BBn+HBP)-2*SO)/ip+cf,3)})
          units=pd.DataFrame(ua);units.to_csv(OUT/'phase9_rotation_bullpen.csv',index=False)

          # Savant canonical gamePk; offense filters, RISP, two-outs, handedness, families.
          def sav(pk):
            url=f'https://baseballsavant.mlb.com/statcast_search/csv?all=true&type=details&game_pk={int(pk)}';last=None
            for i in range(7):
              try:
                r=requests.get(url,headers=H,timeout=90);r.raise_for_status();d=pd.read_csv(io.StringIO(r.text));
                if d.empty:raise RuntimeError('empty')
                return int(pk),d
              except Exception as e:last=e;time.sleep(1.2*(i+1))
            raise last
          fs=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
            fut=[ex.submit(sav,x) for x in uni.GAME_PK]
            for i,f in enumerate(as_completed(fut),1):pk,d=f.result();fs.append(d);print('savant',i,'/425') if i%50==0 else None
          z=pd.concat(fs,ignore_index=True);z['game_pk']=pd.to_numeric(z.game_pk,errors='coerce').astype('Int64');gm=games.set_index('GAME_PK')[['PERIOD','IS_HOME','OPP_STRENGTH','VENUE']].to_dict('index');z['PERIOD']=z.game_pk.map(lambda x:gm[int(x)]['PERIOD']);z['IS_HOME']=z.game_pk.map(lambda x:gm[int(x)]['IS_HOME']);z['OPP_STRENGTH']=z.game_pk.map(lambda x:gm[int(x)]['OPP_STRENGTH']);z['VENUE']=z.game_pk.map(lambda x:gm[int(x)]['VENUE']);bot=z.inning_topbot.astype(str).str.lower().isin(['bot','bottom']);top=z.inning_topbot.astype(str).str.lower().eq('top');bat=z[(z.IS_HOME.astype(bool)&bot)|((~z.IS_HOME.astype(bool))&top)].copy();cov=bat.groupby('PERIOD').game_pk.nunique().to_dict();
          if cov!={'2024':162,'2025':162,'2026_CUTOFF':101}:raise RuntimeError(f'Savant cov {cov}')
          pa=bat[bat.events.notna()].copy();pa['RISP']=pa.on_2b.notna()|pa.on_3b.notna();pa['RISP_H']=pa.RISP & pa.events.astype(str).isin(['single','double','triple','home_run']);pa['TWO_OUT']=pd.to_numeric(pa.outs_when_up,errors='coerce').eq(2);pa['TWO_OUT_H']=pa.TWO_OUT & pa.events.astype(str).isin(['single','double','triple','home_run'])
          dep=pa.groupby(['PERIOD','OPP_STRENGTH','VENUE'],as_index=False).agg(PA=('events','size'),HR=('events',lambda s:int((s.astype(str)=='home_run').sum())),BB=('events',lambda s:int(s.astype(str).isin(['walk','intent_walk']).sum())),ERROR_PA=('events',lambda s:int((s.astype(str)=='field_error').sum())),RISP_PA=('RISP','sum'),RISP_H=('RISP_H','sum'),TWO_OUT_PA=('TWO_OUT','sum'),TWO_OUT_H=('TWO_OUT_H','sum'))
          base=games.groupby(['PERIOD','OPP_STRENGTH','VENUE'],as_index=False).agg(G=('GAME_PK','size'),RS=('RS','sum'),R_1_3=('R_1_3','sum'),R_4_6=('R_4_6','sum'),R_7_PLUS=('R_7_PLUS','sum'),STARTER_RUNS=('STARTER_RUNS','sum'),BULLPEN_RUNS=('BULLPEN_RUNS','sum'),OFF_HALF_INNINGS=('OFF_HALF_INNINGS','sum'),HALF_INNINGS_3PLUS=('HALF_INNINGS_3PLUS','sum'));f7=base.merge(dep,on=['PERIOD','OPP_STRENGTH','VENUE'],how='left');f7['R_G']=f7.RS/f7.G;f7['STARTER_RUNS_G']=f7.STARTER_RUNS/f7.G;f7['BULLPEN_RUNS_G']=f7.BULLPEN_RUNS/f7.G;f7['HI_3PLUS_PCT']=100*f7.HALF_INNINGS_3PLUS/f7.OFF_HALF_INNINGS;f7['RISP_H_PCT']=100*f7.RISP_H/f7.RISP_PA;f7['TWO_OUT_H_PCT']=100*f7.TWO_OUT_H/f7.TWO_OUT_PA;f7.to_csv(OUT/'phase7_integral_matrix.csv',index=False)

          swdesc={'swinging_strike','swinging_strike_blocked','foul','foul_tip','hit_into_play','hit_into_play_no_out','hit_into_play_score'};whdesc={'swinging_strike','swinging_strike_blocked'};abev={'single','double','triple','home_run','field_out','force_out','grounded_into_double_play','field_error','fielders_choice','fielders_choice_out','strikeout','strikeout_double_play','double_play','triple_play'};fams={'FASTBALL':{'FF','SI','FC'},'BREAKING':{'CU','KC','CS','SL','ST','SV'},'OFFSPEED':{'CH','FS','FO','SC'}}
          def pa_metrics(q):
            ev=q.events.astype(str);AB=int(ev.isin(abev).sum());Hn=int(ev.isin(['single','double','triple','home_run']).sum());d2=int((ev=='double').sum());d3=int((ev=='triple').sum());hr=int((ev=='home_run').sum());BBn=int(ev.isin(['walk','intent_walk']).sum());HBP=int((ev=='hit_by_pitch').sum());SF=int((ev=='sac_fly').sum());tb=Hn+d2+2*d3+3*hr;wv=pd.to_numeric(q.woba_value,errors='coerce');wd=pd.to_numeric(q.woba_denom,errors='coerce');est=pd.to_numeric(q.estimated_woba_using_speedangle,errors='coerce');xc=wv.copy();xc.loc[est.notna()]=est.loc[est.notna()];den=wd.fillna(0).sum();return AB,Hn,BBn,HBP,SF,tb,round(Hn/AB,3),round((Hn+BBn+HBP)/(AB+BBn+HBP+SF),3),round(tb/AB,3),round(float(wv.fillna(0).sum()/den),3),round(float(xc.fillna(0).sum()/den),3)
