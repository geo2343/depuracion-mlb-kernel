name: BAL V4.2 Full Recalc

on:
  push:
    paths:
      - '.github/workflows/bal-v42-full-recalc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pandas numpy tabulate
      - name: Reconstruct Baltimore audit gaps
        run: |
          python - <<'PY'
          import io,json,time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests,pandas as pd,numpy as np

          OUT=Path('runtime/bal_v42_final');OUT.mkdir(parents=True,exist_ok=True)
          TEAM_ID=110;TEAM='BAL';H={'User-Agent':'Mozilla/5.0 BAL-V4.2/1.0'}
          periods={
            '2024':('2024-03-28','2024-09-29',162,3.166),
            '2025':('2025-03-27','2025-09-28',162,3.135),
            '2026_CUTOFF':('2026-03-25','2026-07-20',101,None),
          }
          def getj(url,params=None,tries=8):
            last=None
            for i in range(tries):
              try:
                r=requests.get(url,params=params,headers=H,timeout=90);r.raise_for_status();return r.json()
              except Exception as e:last=e;time.sleep(1.2*(i+1))
            raise last
          teams=getj('https://statsapi.mlb.com/api/v1/teams',{'sportId':1})['teams'];meta={int(t['id']):{'name':t['name'],'abbr':t.get('abbreviation','')} for t in teams};team_ids=list(meta)
          def nabbr(x):
            x=str(x).upper();return {'AZ':'ARI','OAK':'ATH','WSN':'WSH','KCR':'KC','SDP':'SD','SFG':'SF','TBR':'TB','CHW':'CWS'}.get(x,x)
          def gamelog(y,end):
            j=getj(f'https://statsapi.mlb.com/api/v1/teams/{TEAM_ID}/stats',{'stats':'gameLog','group':'hitting','season':y,'gameType':'R'})
            r=[]
            for s in j.get('stats',[{}])[0].get('splits',[]):
              dt=s.get('date');pk=(s.get('game') or {}).get('gamePk')
              if dt and pk and dt<=end:r.append({'DATE':dt,'GAME_PK':int(pk),'RS_GAMELOG':int((s.get('stat') or {}).get('runs',0))})
            return pd.DataFrame(r).drop_duplicates('GAME_PK').sort_values(['DATE','GAME_PK']).reset_index(drop=True)
          us=[]
          for p,(start,end,eg,cf) in periods.items():
