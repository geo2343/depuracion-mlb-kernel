          dc=[]
          for p,(start,end,eg,cf) in periods.items():
            d=frv(p,start,end);cols=['total_runs','inf_of_runs','range_runs','arm_runs','dp_runs','fielding_runs_prevented_on_rec1b','catching_runs','framing_runs','throwing_runs','blocking_runs'];
            for c in cols:d[c]=pd.to_numeric(d[c],errors='coerce').fillna(0)
            s={c:float(d[c].sum()) for c in cols};top=s['inf_of_runs']+s['catching_runs'];cat=s['framing_runs']+s['throwing_runs']+s['blocking_runs'];dc.append({'PERIOD':p,'FRV_TOTAL':round(s['total_runs'],3),'INF_OF_RUNS':round(s['inf_of_runs'],3),'RANGE_RUNS':round(s['range_runs'],3),'ARM_RUNS':round(s['arm_runs'],3),'DP_RUNS':round(s['dp_runs'],3),'REC_1B_RUNS':round(s['fielding_runs_prevented_on_rec1b'],3),'CATCHING_RUNS':round(s['catching_runs'],3),'FRAMING_RUNS':round(s['framing_runs'],3),'THROWING_RUNS':round(s['throwing_runs'],3),'BLOCKING_RUNS':round(s['blocking_runs'],3),'TOP_DELTA':round(s['total_runs']-top,6),'CATCH_DELTA':round(s['catching_runs']-cat,6)})
          defense=pd.DataFrame(dc);defense.to_csv(OUT/'phase11_savant_defense_team.csv',index=False)
          if (defense.TOP_DELTA.abs()>0.001).any() or (defense.CATCH_DELTA.abs()>0.001).any():raise RuntimeError('defense reconciliation')
          qa={'games':games.groupby('PERIOD').size().to_dict(),'rs':games.groupby('PERIOD').RS.sum().astype(int).to_dict(),'ra':games.groupby('PERIOD').RA.sum().astype(int).to_dict(),'run_trace_rows':len(tr),'unresolved_runs':int(games.UNRESOLVED.sum()),'statcast_game_coverage':cov,'f7_rows':len(f7),'tto_rows':len(ta),'unit_rows':len(units),'handedness_rows':len(hand),'f10_rows':len(f10),'defense_periods':len(defense),'defense_reconciled':True,'team_research_status':'PASS'};(OUT/'qa_final_team_research.json').write_text(json.dumps(qa,indent=2),encoding='utf-8')
          md=['# BAL V4.2 — RECÁLCULO Y QA FINAL','',json.dumps(qa,indent=2),'','## F7','',f7.to_markdown(index=False),'','## Staff units','',units.to_markdown(index=False),'','## TTO','',ta.to_markdown(index=False),'','## RA thirds','',thirds.to_markdown(index=False),'','## Handedness','',pd.DataFrame(hand).to_markdown(index=False),'','## Pitch families','',pd.DataFrame(f10).to_markdown(index=False),'','## Defense','',defense.to_markdown(index=False)]
          (OUT/'BAL_V42_FINAL.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps(qa,indent=2));print(units.to_string(index=False));print(defense.to_string(index=False))
          PY
      - name: Commit outputs
        if: always()
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email 'mlb-research-bot@users.noreply.github.com'
          git add runtime/bal_v42_final || true
