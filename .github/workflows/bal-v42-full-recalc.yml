          pd.DataFrame(overall).to_csv(OUT/'statcast_offense_homogeneous.csv',index=False);pd.DataFrame(hand).to_csv(OUT/'phase8_handedness_splits.csv',index=False);pd.DataFrame(f10).to_csv(OUT/'phase10_pitch_family_splits.csv',index=False)

