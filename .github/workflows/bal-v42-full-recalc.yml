              if pid is None or int(pid)!=starter:continue
              idx+=1;b='1' if idx<=9 else ('2' if idx<=18 else ('3' if idx<=27 else '4+'));ev=(play.get('result',{}).get('eventType') or '').lower();runs=sum(1 for rn in play.get('runners',[]) if rn.get('movement',{}).get('end')=='score')
              tto.append({'PERIOD':u.PERIOD,'GAME_PK':pk,'TTO':b,'TBF':1,'H':int(ev in {'single','double','triple','home_run'}),'HR':int(ev=='home_run'),'BB':int(ev in {'walk','intent_walk'}),'HBP':int(ev=='hit_by_pitch'),'SO':int(ev in {'strikeout','strikeout_double_play'}),'R_ON_PLAY':runs})
