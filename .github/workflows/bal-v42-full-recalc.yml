              pitch_units.append({'PERIOD':u.PERIOD,'GAME_PK':pk,'PITCHER_ID':pid,'ROLE':'STARTER' if pid==starter else 'BULLPEN','OUTS':ipouts(ps.get('inningsPitched','0.0')),'H':int(ps.get('hits',0) or 0),'ER':int(ps.get('earnedRuns',0) or 0),'HR':int(ps.get('homeRuns',0) or 0),'BB':int(ps.get('baseOnBalls',0) or 0),'HBP':int(ps.get('hitBatsmen',0) or 0),'SO':int(ps.get('strikeOuts',0) or 0),'BF':int(ps.get('battersFaced',0) or 0)})
            opphalf='top' if home else 'bottom';idx=0
