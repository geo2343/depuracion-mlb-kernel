            s=j.get('stats',[{}])[0].get('splits',[]);return (s[0].get('stat') or {}) if s else {}
          league=[]
          with ThreadPoolExecutor(max_workers=15) as ex:
            fs=[ex.submit(team_range,x) for x in team_ids]
            for f in as_completed(fs):league.append(f.result())
          outs=sum(ipouts(x.get('inningsPitched','0.0')) for x in league);ip=outs/3;er=sum(int(x.get('earnedRuns',0) or 0) for x in league);hr=sum(int(x.get('homeRuns',0) or 0) for x in league);bb=sum(int(x.get('baseOnBalls',0) or 0) for x in league);hbp=sum(int(x.get('hitBatsmen',0) or 0) for x in league);so=sum(int(x.get('strikeOuts',0) or 0) for x in league);lgERA=er*9/ip;c2026=lgERA-((13*hr+3*(bb+hbp)-2*so)/ip)
          constants={'2024':3.166,'2025':3.135,'2026_CUTOFF':c2026};(OUT/'fip_constants.json').write_text(json.dumps(constants,indent=2),encoding='utf-8')
          ua=[]
