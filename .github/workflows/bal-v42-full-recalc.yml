            rk=pd.DataFrame([{'TEAM_ID':tid,'TEAM':meta[tid]['name'],'ABBR':nabbr(meta[tid]['abbr']),'G':v[0],'RA':v[1],'RA_G':v[1]/v[0]} for tid,v in agg.items() if tid in meta and v[0]])
            if len(rk)!=30:raise RuntimeError(f'{p}: rank teams={len(rk)}')
