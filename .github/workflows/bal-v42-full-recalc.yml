          def ipouts(v):
            a=str(v).split('.');return int(a[0])*3+(int(a[1]) if len(a)>1 else 0)
          games=[];trace=[];pitch_units=[];tto=[]
          for u in uni.itertuples(index=False):
            pk=int(u.GAME_PK);j=feeds[pk];gd=j['gameData'];ld=j['liveData'];hid=int(gd['teams']['home']['id']);aid=int(gd['teams']['away']['id']);home=hid==TEAM_ID;side='home' if home else 'away';opp='away' if home else 'home';oppid=aid if home else hid
            ls=ld['linescore'];rs=int(ls['teams'][side]['runs']);ra=int(ls['teams'][opp]['runs'])
