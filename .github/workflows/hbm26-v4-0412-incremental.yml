          status=(prior_gate and len(games)>0 and pitch_mismatches==0 and team_line_failures==0 and duplicate_current==0 and savant_ok and unknown_guard and cumulative_dups==0)
          summary['status']='PASS' if status else 'QA_REVIEW'
