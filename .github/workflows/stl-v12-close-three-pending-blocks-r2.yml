name: STL V1.2 Close Three Pending Blocks R2

on:
  push:
    paths:
      - '.github/workflows/stl-v12-close-three-pending-blocks-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pandas numpy tabulate
      - name: Run corrected reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          src=Path('.github/workflows/stl-v12-close-three-pending-blocks.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code=dedent(src[start:end]).replace("'gameType':'R'","'gameTypes':'R'")
          compile(code,'stl_v12_r2.py','exec')
          exec(compile(code,'stl_v12_r2.py','exec'),{'__name__':'__main__'})
          PY
      - name: Commit corrected outputs
        if: always()
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email 'mlb-research-bot@users.noreply.github.com'
          git add runtime/stl_v12 || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'STL V1.2: corrected regular-season reconstruction'; git push; fi
