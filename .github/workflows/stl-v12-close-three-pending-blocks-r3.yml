name: STL V1.2 Close Three Pending Blocks R3

on:
  push:
    paths:
      - '.github/workflows/stl-v12-close-three-pending-blocks-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pandas numpy tabulate
      - name: Run hard-filtered reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          src=Path('.github/workflows/stl-v12-close-three-pending-blocks.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          code=dedent(src[start:end])
          code=code.replace("'gameType':'R'","'gameTypes':'R'")
          old="return [g for d in j.get('dates',[]) for g in d.get('games',[]) if g.get('status',{}).get('abstractGameState')=='Final']"
          new="return [g for d in j.get('dates',[]) for g in d.get('games',[]) if g.get('status',{}).get('abstractGameState')=='Final' and g.get('gameType')=='R']"
          if old not in code: raise RuntimeError('schedule return pattern not found')
          code=code.replace(old,new)
          compile(code,'stl_v12_r3.py','exec')
          exec(compile(code,'stl_v12_r3.py','exec'),{'__name__':'__main__'})
          PY
      - name: Commit corrected outputs
        if: always()
        run: |
          git config user.name 'mlb-research-bot'
          git config user.email 'mlb-research-bot@users.noreply.github.com'
          git add runtime/stl_v12 || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'STL V1.2: hard-filtered regular-season reconstruction'; git push; fi
