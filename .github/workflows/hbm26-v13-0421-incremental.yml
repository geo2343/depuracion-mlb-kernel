name: HBM26 V13 Incremental 0421

on:
  push:
    paths:
      - '.github/workflows/hbm26-v13-0421-incremental.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas pyarrow requests
      - name: Derive and run V13 for 2026-04-21
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          src = Path('.github/workflows/hbm26-v5-0413-incremental.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          code = dedent(src[start:end])

          code = code.replace("OUT/'hbm26_v4_all_recon.csv'", "OUT/'__PARENT_ALL_RECON__.csv'")
          code = code.replace("OUT/'hbm26_v4_bullpen.csv'", "OUT/'__PARENT_BULLPEN__.csv'")
          code = code.replace('TARGET=date(2026,4,13); PRIOR_END=date(2026,4,12)',
                              'TARGET=date(2026,4,21); PRIOR_END=date(2026,4,20)')
          code = code.replace('HBM-26-V5-0413/1.0', 'HBM-26-V13-0421/1.0')
          code = code.replace('prior_bull_rows==1557', 'prior_bull_rows==2226')
          code = code.replace('Parent V4 gate failed', 'Parent V12 gate failed')
          code = code.replace('hbm26_v5', 'hbm26_v13')
          code = code.replace('0413', '0421')
          code = code.replace('QA_VALIDATED_CANONICAL_V5', 'QA_VALIDATED_CANONICAL_V13')
          code = code.replace('QA_VALIDATED_PBP_V5', 'QA_VALIDATED_PBP_V13')
          code = code.replace('V5 2026-04-13 QA failed', 'V13 2026-04-21 QA failed')
          code = code.replace("OUT/'__PARENT_ALL_RECON__.csv'", "OUT/'hbm26_v12_all_recon.csv'")
          code = code.replace("OUT/'__PARENT_BULLPEN__.csv'", "OUT/'hbm26_v12_bullpen.csv'")

          compile(code, 'hbm26_v13_0421_derived.py', 'exec')
          exec(compile(code, 'hbm26_v13_0421_derived.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit V13 outputs
        if: always()
        run: |
          git config user.name 'hbm26-qa-bot'
          git config user.email 'hbm26-qa-bot@users.noreply.github.com'
          git add runtime/hbm26_v13_*.csv runtime/hbm26_v13_0421_summary.json || true
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'HBM-26: validated increment 2026-04-21'; git push; fi
