name: HBM26 Savant Fallback Audit

on:
  push:
    paths:
      - '.github/workflows/hbm26-savant-fallback-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas requests
      - name: Distinguish physical pitches from automatic events
        run: |
          python - <<'PY'
          import io, json, time
          from pathlib import Path
          import pandas as pd
          import requests

          GAME_PKS=[823484,824702,824861,824458,824053,824051,823565]
          OUT=Path('runtime'); OUT.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 HBM26-QA'})
          rows=[]; game_rows=[]; null_rows=[]
          for gp in GAME_PKS:
              url=f'https://baseballsavant.mlb.com/statcast_search/csv?all=true&type=details&game_pk={gp}'
              raw=pd.read_csv(io.StringIO(S.get(url,timeout=90).text))
              if 'game_pk' in raw.columns:
                  raw=raw[pd.to_numeric(raw['game_pk'],errors='coerce')==gp].copy()
              has_type=raw['pitch_type'].notna() & raw['pitch_type'].astype(str).str.strip().ne('')
              has_speed=raw['release_speed'].notna() if 'release_speed' in raw.columns else pd.Series(False,index=raw.index)
              physical=has_type | has_speed
              null=raw[~has_type].copy()
              for _,x in null.iterrows():
                  null_rows.append({c:x.get(c) for c in ['game_pk','pitcher','player_name','inning','inning_topbot','at_bat_number','pitch_number','pitch_type','release_speed','description','type','events','des','sv_id']})
              df=raw[physical].copy()
              df['pitcher']=pd.to_numeric(df['pitcher'],errors='coerce').astype('Int64')
              grouped=df.dropna(subset=['pitcher']).groupby('pitcher',as_index=False).agg(savant_pitches=('pitcher','size'))
              feed=S.get(f'https://statsapi.mlb.com/api/v1.1/game/{gp}/feed/live',timeout=60).json()
              box=[]
              for side in ('away','home'):
                  tm=feed['liveData']['boxscore']['teams'][side]
                  for pid in tm.get('pitchers',[]):
                      pobj=tm.get('players',{}).get(f'ID{pid}',{}); stat=pobj.get('stats',{}).get('pitching',{})
                      if stat.get('numberOfPitches') is None: continue
                      box.append({'pitcher':int(pid),'box_name':pobj.get('person',{}).get('fullName'),'box_np':int(stat['numberOfPitches']),'team_side':side})
              b=pd.DataFrame(box)
              g=grouped.merge(b,on='pitcher',how='outer',indicator=True)
              g['game_pk']=gp; g['delta']=g['savant_pitches']-g['box_np']; g['match']=g['delta'].eq(0)&g['_merge'].eq('both')
              rows.extend(g.to_dict('records'))
              game_rows.append({'game_pk':gp,'raw_rows':len(raw),'pitch_type_rows':int(has_type.sum()),'release_speed_rows':int(has_speed.sum()),
                                'physical_rule_rows':int(physical.sum()),'box_pitch_sum':int(b['box_np'].sum()),
                                'physical_delta':int(physical.sum()-b['box_np'].sum()),'null_pitch_type_rows':int((~has_type).sum()),
                                'null_type_with_speed':int((~has_type & has_speed).sum()),'pitcher_mismatch':int((~g['match'].fillna(False)).sum())})
              time.sleep(.4)
          out=pd.DataFrame(rows); bad=out[out['match']!=True]
          out.to_csv(OUT/'hbm26_savant_fallback_pitchers.csv',index=False)
          pd.DataFrame(game_rows).to_csv(OUT/'hbm26_savant_fallback_games.csv',index=False)
          pd.DataFrame(null_rows).to_csv(OUT/'hbm26_savant_null_pitch_type_rows.csv',index=False)
          sm={'games':len(GAME_PKS),'game_rows':game_rows,'pitcher_rows':len(out),'pitcher_exact':int(out['match'].fillna(False).sum()),
              'pitcher_mismatches':len(bad),'bad':bad[['game_pk','pitcher','savant_pitches','box_np','delta','_merge']].to_dict('records') if len(bad) else []}
          (OUT/'hbm26_savant_fallback_summary.json').write_text(json.dumps(sm,indent=2,default=str),encoding='utf-8')
          print(json.dumps(sm,indent=2,default=str))
          PY
      - name: Commit fallback audit
        run: |
          git config user.name 'hbm26-qa-bot'
          git config user.email 'hbm26-qa-bot@users.noreply.github.com'
          git add runtime/hbm26_savant_fallback_*.csv runtime/hbm26_savant_null_pitch_type_rows.csv runtime/hbm26_savant_fallback_summary.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'HBM-26: classify Savant no-pitch-type events'; git push; fi
